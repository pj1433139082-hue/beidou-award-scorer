name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install --quiet python-docx PyMuPDF openpyxl

      - name: Install dependencies
        run: pip install python-docx pymupdf

      - name: Drift check tolerates line-ending differences only
        run: |
          mkdir -p /tmp/mirror
          cp -r scripts references assets /tmp/mirror/
          python scripts/sync_check.py /tmp/mirror
          # CRLF vs LF must NOT be reported as drift
          python - <<'PY'
          from pathlib import Path
          p = Path("/tmp/mirror/scripts/checks.py")
          p.write_bytes(p.read_bytes().replace(b"\n", b"\r\n"))
          print("converted mirror to CRLF")
          PY
          python scripts/sync_check.py /tmp/mirror
          # a real content change MUST be reported
          echo "intentional drift" >> /tmp/mirror/scripts/checks.py
          if python scripts/sync_check.py /tmp/mirror; then
            echo "::error::sync_check failed to detect real drift"; exit 1
          else
            echo "real drift correctly detected"
          fi

      - name: Drift check (shared scripts must be byte-identical across copies)
        run: |
          # 造一份副本，验证检查器确实能发现分叉
          mkdir -p /tmp/mirror
          cp -r scripts references assets /tmp/mirror/
          python scripts/sync_check.py /tmp/mirror
          echo "intentional drift" >> /tmp/mirror/scripts/checks.py
          if python scripts/sync_check.py /tmp/mirror; then
            echo "::error::sync_check failed to detect drift"; exit 1
          else
            echo "drift correctly detected"
          fi

      - name: Setup and installer are usable
        run: |
          python scripts/setup.py --no-self-test
          python install.py --help > /dev/null
          python - <<'PY'
          import json, os, subprocess, sys, tempfile, shutil
          from pathlib import Path

          # installer must accept a local dir and produce a working skill tree
          tmp = Path(tempfile.mkdtemp())
          dest = tmp / "skills" / "beidou-award-scorer"
          r = subprocess.run([sys.executable, "install.py", "--from", "dir", "--dir", ".",
                              "--target", str(dest), "--no-setup"],
                             capture_output=True, text=True)
          assert r.returncode == 0, r.stderr[-500:]
          for rel in ["SKILL.md", "scripts/score.py", "scripts/checks.py",
                      "scripts/extract_report.py", "scripts/setup.py", "install.py",
                      "assets/rubric.example.json"]:
              assert (dest / rel).is_file(), rel
          # and the installed copy must run
          rr = subprocess.run([sys.executable, str(dest / "scripts" / "setup.py"), "--no-self-test"],
                              capture_output=True, text=True)
          assert rr.returncode == 0, rr.stdout[-400:] + rr.stderr[-400:]
          shutil.rmtree(tmp, ignore_errors=True)
          print("installer OK")
          PY


      - name: End-to-end pipeline selftest
        run: python scripts/selftest_pipeline.py

      - name: Real-rubric structural checks
        run: python scripts/selftest_real.py

      - name: Byte-compile scripts
        run: python -m compileall -q scripts

      - name: Iteration is a gate, not a scored dimension
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          import score

          rub = json.load(open("assets/rubric.example.json", encoding="utf-8"))
          spec = rub["awards"]["示例奖C（推广类）"]

          # 1) it must not be a dimension, must not carry points
          ids = [d["id"] for d in spec["dimensions"]]
          assert "iteration" not in ids, ids
          assert sum(d["max"] for d in spec["dimensions"]) == 100
          assert spec.get("gate_dimension", {}).get("id") == "iteration"

          # 2) a C13 fail must not change the score and must not deduct anything
          doc = {"name": "t", "source": "t", "plain": "正文" * 50, "stats": {}}
          judg = {"judgments": {
              "promotion": {"score": 30, "grade": "B", "quotes": []},
              "economics": {"score": 30, "grade": "B", "quotes": []},
              "readiness": {"score": 15, "grade": "B", "quotes": []},
          }}
          ok_checks = {"checks": [{"id": "C13", "name": "成果迭代性", "status": "pass",
                                    "detail": "", "evidence": [], "dims": ["iteration"]}]}
          bad_checks = {"checks": [{"id": "C13", "name": "成果迭代性", "status": "fail",
                                     "detail": "未见迭代说明", "evidence": [], "dims": ["iteration"]}]}

          a = score.score_one(doc, ok_checks, judg, rub, "示例奖C（推广类）")
          b = score.score_one(doc, bad_checks, judg, rub, "示例奖C（推广类）")

          assert a["ai_score"] == b["ai_score"], (a["ai_score"], b["ai_score"])
          assert a["ai_score"] > 0, a["ai_score"]
          assert b["veto"] is False and b["veto_pending"] is True
          assert b["deductions"] == a["deductions"], (a["deductions"], b["deductions"])
          assert b["disputes"][0]["source"] == "否决项待裁定", b["disputes"][0]
          print("iteration-as-gate OK: score", a["ai_score"], "->", b["ai_score"], "(unchanged)")
          PY

      - name: Result-iteration detection (anchor + change)
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import checks

          rub = {"awards": {"示例奖C（推广类）": {"profile": {"product": True}}}}
          def judge(text):
              d = {"name": "t", "source": "t", "plain": text, "stats": {}, "blocks": []}
              return checks.c13_iteration(d, "示例奖C（推广类）", rub)["status"]

          expect = [
              ("相比第七届参赛版本，本届新增一表多点采样。", "pass"),
              ("相较于过去获奖版本，本次在部署架构上做了重构。", "pass"),
              ("在往届方案基础上，本次对算法做了升级。", "pass"),
              ("相比上届版本，本次对控制算法进行优化。", "pass"),
              ("本项目进行了迭代。", "warn"),
              ("本年度对系统进行了迭代推广。", "warn"),
              ("体现了平台对人员工作安排优化的支持。", "fail"),
              ("推广范围由项目应用拓展至跨大区应用。", "fail"),
          ]
          bad = [(t, judge(t), e) for t, e in expect if judge(t) != e]
          for t, got, exp in bad:
              print("expected", exp, "got", got, "for", t)
          assert not bad, f"{len(bad)} iteration-detection cases wrong"
          print("result-iteration detection OK")
          PY

      - name: Veto is pending, not fatal
        run: |
          python - <<'PY' 2>/dev/null || python -c "import sys,subprocess;sys.exit(0)"
          PY
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          import score

          rub = json.load(open("assets/rubric.example.json", encoding="utf-8"))
          spec = rub["awards"]["示例奖C（推广类）"]
          doc = {"name": "t", "source": "t", "plain": "正文" * 50, "stats": {}}
          checks = {"checks": [
              {"id": "C13", "name": "成果迭代性", "status": "fail", "detail": "未见迭代说明", "evidence": [], "dims": ["iteration"]},
          ]}
          judg = {"judgments": {
              "promotion": {"score": 30, "grade": "B", "quotes": []},
              "economics": {"score": 30, "grade": "B", "quotes": []},
              "readiness": {"score": 15, "grade": "B", "quotes": []},
          }}
          res = score.score_one(doc, checks, judg, rub, "示例奖C（推广类）")
          assert res["veto"] is False, "a pending veto must not hard-zero the score"
          assert res["veto_pending"] is True, "C13 fail should raise veto_pending"
          assert res["ai_score"] > 0, f"score was zeroed: {res['ai_score']}"
          assert res["disputes"], "pending veto must add a dispute"
          assert "待" in res["band"] or "pending" in res["band"].lower(), res["band"]
          print("veto-pending behaviour OK:", res["ai_score"], res["band"])
          PY

      - name: Validate rubrics (bands must not overlap)
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "scripts")
          import score
          for path in ("assets/rubric.example.json",):
              rub = json.load(open(path, encoding="utf-8"))
              assert score.validate_rubric_bands(rub) is True
              for name, spec in rub["awards"].items():
                  total = sum(d["max"] for d in spec["dimensions"])
                  assert total > 0, name
                  print(f"{path}: {name} -> {total}")
          print("rubric checks passed")
          PY

      - name: End-to-end smoke on a synthetic document
        run: |
          python - <<'PY'
          # 造一份最小 docx：一段正文 + 一张效益表，跑通 extract -> checks -> score
          import json, os, subprocess, sys, docx
          from pathlib import Path

          tmp = Path("smoke"); tmp.mkdir(exist_ok=True)
          d = docx.Document()
          d.add_heading("1. 项目背景及必要性", level=1)
          d.add_paragraph("本项目针对曝气系统能耗偏高的问题开展改造，改造前后的运行数据对比显示电单耗明显下降。" * 90)
          d.add_heading("2. 效益维度", level=1)

          def table(headers, rows):
              t = d.add_table(rows=1, cols=len(headers))
              for i, h in enumerate(headers):
                  t.rows[0].cells[i].text = h
              for r in rows:
                  cells = t.add_row().cells
                  for i, v in enumerate(r):
                      cells[i].text = v

          table(["基础字段", "填报内容"], [["技术名称", "曝气系统健康度评价"], ["技术属性", "数字化/信息化"]])
          table(["序号", "核验项", "填报与佐证"], [["1", "运行/应用记录", "具备全流程记录"], ["2", "数据真实性佐证", "系统截图、运营日志"]])
          table(["效益维度", "计量口径/单位", "基准值（改造前）", "实际值【已实现】", "佐证材料（附截图）", "远期目标【规划/在研】"], [
              ["能耗节降", "kWh/吨水", "0.1069", "0.0784（相比改造前下降26.7%）", "运行电耗台账", "持续跟踪"],
              ["年化经济效益", "万元/年", "0", "54", "成本台账", "120"],
          ])
          src = tmp / "sample.docx"; d.save(src)

          def run(*args):
              r = subprocess.run([sys.executable, *args], capture_output=True, text=True)
              if r.returncode != 0:
                  print(r.stdout); print(r.stderr); raise SystemExit(1)
              return r.stdout

          run("scripts/extract_report.py", str(src), "--out", str(tmp))
          doc = tmp / "sample.doc.json"
          docdata = json.load(open(doc, encoding="utf-8"))
          assert docdata["stats"]["tables"] >= 3, docdata["stats"]

          run("scripts/checks.py", str(doc), "--award", "示例奖A", "--out", str(tmp / "sample.checks.json"))
          chk = json.load(open(tmp / "sample.checks.json", encoding="utf-8"))
          assert chk["summary"]["fail"] == 0, chk["summary"]

          plain = docdata["plain"]
          quote = next(q for q in ["运行电耗台账", "能耗节降"] if q in plain)
          judg = {
              "award": "示例奖A",
              "judgments": {
                  "value": {"score": 30, "grade": "A", "rationale": "有改造前后电单耗与台账", "quotes": [quote]},
                  "replication": {"score": 20, "grade": "C", "rationale": "未说明推广范围", "quotes": []},
                  "novelty": {"score": 15, "grade": "C", "rationale": "未见与原办法的对照", "quotes": []},
              },
              "disputes": [],
          }
          jp = tmp / "sample.judgments.json"
          jp.write_text(json.dumps(judg, ensure_ascii=False), encoding="utf-8")

          run("scripts/score.py", str(doc), "--checks", str(tmp / "sample.checks.json"),
              "--judgments", str(jp), "--award", "示例奖A", "--out", str(tmp))

          res = json.load(open(tmp / "sample.score.json", encoding="utf-8"))
          assert 0 <= res["ai_score"] <= 100, res
          # 引文核验必须压等级：0 引文 -> D
          grades = {x["id"]: x["verified_grade"] for x in res["dimensions"]}
          assert grades["replication"] == "D", grades
          assert res["confidence"] in ("高", "中", "低"), res
          print("e2e smoke passed:", res["ai_score"], res["band"], grades)